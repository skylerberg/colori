[package]
name = "colori-core"
version = "0.1.0"
edition = "2021"

[features]
# Wall-clock search budgets. Off by default because `Instant` panics on
# wasm32-unknown-unknown; native consumers turn it on.
time = ["mcts/time"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mcts = { git = "https://github.com/skylerberg/monte_carlo", default-features = false }
rand = "0.10"
wyrand = "0.4"
rustc-hash = "2"
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
wyrand = "0.4"

[[bench]]
name = "unordered_cards_bench"
harness = false

[[bench]]
name = "ismcts_bench"
harness = false
