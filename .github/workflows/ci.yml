name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # colori-gui links eframe and rfd, which need GTK and X11 headers.
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs pnpm and Node in one step, reading the pnpm version from
      # package.json's `packageManager`. pnpm/action-setup is deprecated for
      # pnpm 11; pnpm/setup is its replacement.
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: pnpm run build:wasm

      # colori-wasm/build.rs regenerates src/data/cards.ts from the Rust card
      # definitions. A diff here means the card data and its generator have
      # drifted apart — regenerate with `pnpm run build:wasm` and commit.
      - name: Check generated card data is up to date
        run: git diff --exit-code src/data/cards.ts

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
