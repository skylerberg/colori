name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    # An empty RUSTFLAGS overrides .cargo/config.toml's target-cpu=native.
    # rust-cache restores dependencies built on whichever runner saved the
    # cache, and a runner whose CPU lacks what they were built for dies with
    # SIGILL.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # colori-gui is excluded from both commands. It links eframe and rfd, so
      # building it means installing GTK and X11 headers and compiling the
      # whole egui stack — most of this job's runtime for its one log-parsing
      # test. Run `cargo test -p colori-gui` locally after touching it.
      - name: Build
        run: cargo build --workspace --all-targets --exclude colori-gui

      - name: Test
        run: cargo test --workspace --exclude colori-gui

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs pnpm and Node in one step, reading the pnpm version from
      # package.json's `packageManager`. pnpm/action-setup is deprecated for
      # pnpm 11; pnpm/setup is its replacement.
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: pnpm run build:wasm

      # colori-wasm/build.rs regenerates src/data/cards.ts from the Rust card
      # definitions. A diff here means the card data and its generator have
      # drifted apart — regenerate with `pnpm run build:wasm` and commit.
      - name: Check generated card data is up to date
        run: git diff --exit-code src/data/cards.ts

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
